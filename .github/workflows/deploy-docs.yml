name: Deploy docs (MkDocs) to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 Pages 배포만 진행하고, 진행 중 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

# mkdocs-material 이 출력하는 "MkDocs 2.0" 광고성 경고를 로그에서 억제한다.
env:
  DISABLE_MKDOCS_2_WARNING: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install MkDocs Material
        run: pip install mkdocs-material mkdocs-awesome-pages-plugin mkdocs-same-dir
      - name: Configure Pages (Actions 소스로 자동 활성화)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site
        run: mkdocs build --site-dir _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
